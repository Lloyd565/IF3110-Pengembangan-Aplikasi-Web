name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci && npm run build && npm audit --omit=dev
        working-directory: frontend
      - run: go build ./...
      - run: go vet ./...
      - run: docker compose up -d --wait test-db mariadb-test
      - run: go test -race ./... -count=1
        env:
          TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5435/test?sslmode=disable
          TEST_MARIADB_DSN: root:test@tcp(127.0.0.1:3308)/
