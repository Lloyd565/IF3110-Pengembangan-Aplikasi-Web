name: CI

on:
  push:
    branches: [main, dev, "feat/**", A]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      test-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mariadb-test:
        image: mariadb:12.2
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_ROOT_HOST: "%"
          MARIADB_DATABASE: test
        ports:
          - 3308:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5435/test?sslmode=disable
      TEST_MARIADB_DSN: root:test@tcp(127.0.0.1:3308)/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -v
