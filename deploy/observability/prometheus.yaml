global:
  scrape_interval: 10s
  evaluation_interval: 10s
scrape_configs:
  - job_name: platform-api
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:8080]
  - job_name: platform-worker
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:9102]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
